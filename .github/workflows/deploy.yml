name: 🚀 Deploy Hilight Football (Laravel 12 + Inertia + React) to Hostinger (madbrainbox.com server)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup PHP
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, sqlite, pdo_sqlite
          tools: composer:v2

      # 3️⃣ Install Composer dependencies
      - name: 📦 Install Composer dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      # 4️⃣ Prepare environment file (Wayfinder & Vite-এর জন্য build-এর আগেই প্রয়োজন)
      - name: ⚙️ Prepare .env
        run: |
          run: php -r "file_exists('.env') || copy('.env.staging', '.env');"
          mkdir -p resources/js/types || true

      # 5️⃣ Setup Node
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 6️⃣ Install NPM dependencies
      - name: 📦 Install NPM dependencies
        run: npm ci

      # 7️⃣ Build React / Inertia (Vite + Wayfinder)
      - name: ⚛️ Build frontend assets
        env:
          WAYFINDER_SKIP: 'true'
          CI: 'true'
        run: npm run build

      - name: Remove node_modules to save inodes
        run: rm -rf node_modules

      # 8️⃣ Deploy to Hostinger via SCP (SSH)
      - name: 🚀 Deploy to Hostinger via SCP (SSH)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: "/home/u241149697/domains/madbrainbox.com/public_html/hlf"
          rm: false
          strip_components: 0

      # 9️⃣ Run Laravel Artisan Commands
      - name: ⚙️ Run Laravel Artisan Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/u241149697/domains/madbrainbox.com/public_html/hlf

            /opt/alt/php84/usr/bin/php artisan optimize:clear
            /opt/alt/php84/usr/bin/php artisan cache:clear
            /opt/alt/php84/usr/bin/php artisan view:clear
            /opt/alt/php84/usr/bin/php artisan route:clear
            /opt/alt/php84/usr/bin/php artisan optimize

      # 🔟 Done message
      - name: ✅ Deployment finished
        run: echo "Hilight Football deployed successfully"
